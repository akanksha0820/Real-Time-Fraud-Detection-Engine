name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      # New hardened boundary is lint-clean; legacy modules are migrated incrementally.
      - run: ruff check api tests/conftest.py tests/test_api_contract.py tests/test_api_security.py
      - run: bandit -q -r api
      - run: pytest -q
      - run: docker build -t fraud-risk-engine:ci .
